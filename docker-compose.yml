services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cinema-backend
    env_file:
      - ./Backend/.env
    ports:
      - "4994:1325"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend/client
      dockerfile: Dockerfile
    container_name: cinema-frontend
    ports:
      - "5007:80"
    depends_on:
      - backend
    restart: unless-stopped
