server:
  port: 1325
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: 10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|127\.\d+\.\d+\.\d+|::1|0:0:0:0:0:0:0:1

spring:
  application:
    name: CinemaBooking

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.batch_size: 1000
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

app:
    appDomain: ${APP_DOMAIN:http://cinema.vuhongquang.com/}
    auth:
      cookie:
        secure: ${AUTH_COOKIE_SECURE:true}
        same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    database:
      # Prefer DB_URL (full jdbc url). Keep DB_HOST for backward compatibility.
      url: ${DB_URL:${DB_HOST:jdbc:mysql://localhost:3306/cinema_booking}}?rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

    jwt:
      secret: ${JWT_SECRET}
      expirationMs: ${JWT_EXPIRATION_MS:3600000} # 1 hour in milliseconds

    paySecret:
      clientId: ${PAYOS_CLIENT_ID}
      apiKey: ${PAYOS_API_KEY}
      checksumKey: ${PAYOS_CHECKSUM_KEY}

    minio:
      url: ${MINIO_URL}
      accessKey: ${MINIO_ACCESS_KEY}
      secretKey: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET}

    mail:
      host: ${MAIL_HOST}
      port: ${MAIL_PORT}
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      auth: true
      startTls: true

    cors:
      allow-all: ${CORS_ALLOW_ALL:false}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://cinema.vuhongquang.com}
  