server:
  port: 1325

spring:
  application:
    name: CinemaBooking

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.batch_size: 1000
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

app:
    appDomain: ${APP_DOMAIN:localhost}
    database:
      url: ${DB_HOST:localhost}?rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

    jwt:
      secret: ${JWT_SECRET}
      expirationMs: ${JWT_EXPIRATION_MS:3600000} # 1 hour in milliseconds

    paySecret:
      clientId: ${PAYOS_CLIENT_ID}
      apiKey: ${PAYOS_API_KEY}
      checksumKey: ${PAYOS_CHECKSUM_KEY}

    minio:
      url: ${MINIO_URL}
      accessKey: ${MINIO_ACCESS_KEY}
      secretKey: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET}

    mail:
      host: ${MAIL_HOST}
      port: ${MAIL_PORT}
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      auth: true
      startTls: true

    cors:
      allow-all: ${CORS_ALLOW_ALL:true}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://103.162.20.119:5173}
  